name: test

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Keep in sync with scripts/ci.sh local prerequisites.
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # TEMPORARY: resolve the lockfile for new dependencies (MSRV-aware, for the
      # 1.88 Docker build) and upload it. Remove before merging.
      - name: Resolve Cargo.lock
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: cargo metadata --format-version 1 > /dev/null

      - name: Upload Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test with coverage gate (≥90% lines)
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info \
            --fail-under-lines 90 \
            --ignore-filename-regex '(^|/)main\.rs$'

      - name: Upload LCOV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: ignore
