name: Pages

# Publishes the verifier page (verifier/) to this repo's GitHub Pages. The marketing site in
# site/ is hosted from the production sigstack-bot repo, not from here.

on:
  push:
    branches: [main]
    paths:
      - 'verifier/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'verifier/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Published builds hash to their compose hashes
        run: python3 verifier/check_builds.py
      - name: Page script parses
        run: |
          python3 - <<'EOF'
          import pathlib
          html = pathlib.Path("verifier/index.html").read_text()
          start = html.index("<script>") + len("<script>")
          pathlib.Path("/tmp/verifier.js").write_text(html[start:html.rindex("</script>")])
          EOF
          node --check /tmp/verifier.js

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r verifier/index.html verifier/builds.json verifier/builds _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
