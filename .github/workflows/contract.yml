name: contract

on:
  push:
    branches: [main]
    paths:
      - "contracts/agent/**"
      - ".github/workflows/contract.yml"
      - "scripts/test_contract.sh"
  pull_request:
    paths:
      - "contracts/agent/**"
      - ".github/workflows/contract.yml"
      - "scripts/test_contract.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: contracts/agent
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain pinned in contracts/agent/rust-toolchain.toml.
      - run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/agent

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked
      # Unit tests, the wasm build in the pinned cargo-near image, and the near-sandbox
      # integration tests: the same script the README gives judges.
      - run: ../../scripts/test_contract.sh

      - name: Record wasm hash
        run: |
          echo '### Agent contract wasm' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sha256sum target/near/*.wasm | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: agent-contract-wasm
          path: contracts/agent/target/near/*.wasm
