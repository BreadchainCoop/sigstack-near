name: contract

on:
  push:
    branches: [main]
    paths:
      - "contracts/agent/**"
      - ".github/workflows/contract.yml"
  pull_request:
    paths:
      - "contracts/agent/**"
      - ".github/workflows/contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: contracts/agent
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain pinned in contracts/agent/rust-toolchain.toml.
      - run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/agent

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --lib --locked

      # Same image and digest as Cargo.toml's reproducible_build metadata, so CI and
      # release builds use one toolchain. The container runs as root, hence the chown.
      - name: Build wasm
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            sourcescan/cargo-near@sha256:772638e343baeeea24e49062c7d424274f3441452cc06ce97fc4e5695b19fecc \
            cargo near build non-reproducible-wasm --locked --no-abi
          sudo chown -R "$(id -u):$(id -g)" target

      - name: Record wasm hash
        run: |
          echo '### Agent contract wasm' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sha256sum target/near/*.wasm | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Sandbox integration tests load the wasm built above.
      - run: cargo test --tests --locked

      - uses: actions/upload-artifact@v4
        with:
          name: agent-contract-wasm
          path: contracts/agent/target/near/*.wasm
