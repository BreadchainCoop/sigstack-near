[package]
name = "sigstack-agent"
version = "0.1.0"
edition = "2024"
description = "Registry of Sigstack bots whose TEE attestation matches an approved build"
license = "Apache-2.0"

# For reproducible builds
repository = "https://github.com/BreadchainCoop/sigstack-near"
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.19.0-rust-1.86.0"
image_digest = "sha256:772638e343baeeea24e49062c7d424274f3441452cc06ce97fc4e5695b19fecc"
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
    "--no-abi",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }
near-sdk = "=5.26.1"
serde = { version = "=1.0.228", features = ["derive"] }
shade-attestation = { git = "https://github.com/NearDeFi/shade-agent-framework", rev = "35758f354ad9862fb590daf9843fea4974d52549" }

[[test]]
name = "attestation_tests"
path = "tests/attestation_tests.rs"

[[test]]
name = "large_num_agents_tests"
path = "tests/large_num_agents_tests.rs"

[[test]]
name = "owner_operations_tests"
path = "tests/owner_operations_tests.rs"

[[test]]
name = "update_contract_tests"
path = "tests/update_contract_tests.rs"

[dev-dependencies]
near-api = "=0.8.6"
near-api-types = "=0.8.6"
near-sandbox = "=0.3.11"
near-sdk = { version = "=5.26.1", features = ["unit-testing"] }
serde_json = "=1.0.149"
shade-attestation = { git = "https://github.com/NearDeFi/shade-agent-framework", rev = "35758f354ad9862fb590daf9843fea4974d52549" }
tokio = { version = "=1.52.3", features = ["full"] }

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Opt into extra safety checks on arithmetic operations https://stackoverflow.com/a/64136471/249801
overflow-checks = true

# Standalone: not part of the bot workspace at the repo root.
[workspace]
