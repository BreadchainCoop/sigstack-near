# NEAR HACKATHON demo — its own CVM and Signal number. Never deploy this to the
# production CVM (0e82fa77-…); production uses docker/phala.yaml.
#
# Everything a verifier relies on is written into this file, because dstack measures
# this file's text into the compose hash but not env var values. Images are pinned by
# digest (scripts/pin_demo_images.sh rewrites them); only real secrets come from env
# (docker/.phala-demo.env, see .phala-demo.env.example).
#
# No registration proxy: its debug and adopt routes are unauthenticated and could
# deregister the bot's number. Register once with docker/phala-demo-register.yaml, then
# upgrade the same CVM in place to this file; the Signal account survives in the
# signal-config-translation volume. Only this file's compose hash is ever approved.
#
# Commerce is left out until the payments work (#15) needs it.

services:
  signal-api:
    image: bbernhard/signal-cli-rest-api@sha256:2399d449123cdad56c4d859277e3b9127e1a00c4d2ab4601c239882609286cf8
    environment:
      - MODE=normal
      - LOG_LEVEL=info
    volumes:
      - signal-config-translation:/home/.local/share/signal-cli
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  signal-bot:
    image: ghcr.io/breadchaincoop/sigstack-near-bot-tee@sha256:804403db091a609298c46f02ddf758732884aee57dc4e6cfc1baae130c3515f9
    environment:
      - SIGNAL__SERVICE_URL=http://signal-api:8080
      - SIGNAL__PHONE_NUMBER=${SIGNAL_PHONE}
      - NEAR_AI__API_KEY=${NEAR_AI_API_KEY}
      - NEAR_AI__BASE_URL=https://cloud-api.near.ai/v1
      - NEAR_AI__MODEL=deepseek-ai/DeepSeek-V4-Flash
      - NEAR_AI__TIMEOUT=120s
      - WHISPER__ENABLED=true
      - WHISPER__SERVICE_URL=https://cloud-api.near.ai/v1
      - WHISPER__MODEL=openai/whisper-large-v3
      - WHISPER__TIMEOUT=120s
      - TRANSLATE_ALL__ENABLED=true
      - TRANSLATE_ALL__MAX_MESSAGES_PER_MINUTE=30
      - BOT__LOG_LEVEL=info
      - BOT__SIGNAL_USERNAME=sigstackdemo
      - BOT__GITHUB_REPO=https://github.com/BreadchainCoop/sigstack-near
      - BOT__VERIFIER_URL=https://breadchaincoop.github.io/sigstack-near/
      - DSTACK__SOCKET_PATH=/var/run/dstack.sock
      - GROUP_PREFERENCES__PERSIST=true
      - GROUP_PREFERENCES__STORAGE_PATH=/data/group_prefs.enc
      - ENTITLEMENTS__PERSIST=true
      - ENTITLEMENTS__STORAGE_PATH=/data/entitlements.enc
      - ENTITLEMENTS__ENFORCE=false
      # Agent contract registration: each boot generates a key in TEE memory, the
      # sponsor funds its implicit account, and the bot registers its attestation.
      # AGENT__CONTRACT_ID is set here, not in env, so the compose hash pins which
      # contract the bot registers with.
      - AGENT__CONTRACT_ID=agent.sigstack.testnet
      - AGENT__RPC_URL=https://test.rpc.fastnear.com
      - AGENT__PCCS_URLS=https://pccs.phala.network,https://api.trustedservices.intel.com
      - AGENT__SPONSOR_ACCOUNT_ID=${AGENT_SPONSOR_ACCOUNT_ID}
      - AGENT__SPONSOR_PRIVATE_KEY=${AGENT_SPONSOR_PRIVATE_KEY}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock:ro
      - group-prefs-translation:/data
    depends_on:
      - signal-api
    restart: unless-stopped

volumes:
  signal-config-translation:
    driver: local
  group-prefs-translation:
    driver: local
